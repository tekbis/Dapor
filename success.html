<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070707" />
  <title>Order confirmed — DA’POR Millionaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body class="success-page">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="DA’POR Millionaires home"><img src="assets/dapor-logo-transparent.png" alt="DA’POR Millionaires" /></a>
  </header>
  <main class="success-shell">
    <p class="eyebrow dark">Payment received</p>
    <h1>Thank you.</h1>
    <p class="success-copy" id="success-copy">Confirming your Stripe payment…</p>
    <p class="success-meta" id="success-meta"></p>
    <a class="button gold" href="index.html#new">Return to the collection</a>
  </main>
  <script src="stripe-checkout.js?v=10"></script>
  <script>
    (function () {
      const copy = document.getElementById("success-copy");
      const meta = document.getElementById("success-meta");
      const sessionId = new URLSearchParams(window.location.search).get("session_id") || "";
      window.DAPOR_STRIPE.clearPaidCart();
      if (!sessionId) {
        copy.textContent = "Your bag has been cleared. If you completed payment, a receipt is on its way from Stripe.";
        return;
      }
      fetch(`/api/checkout-session?session_id=${encodeURIComponent(sessionId)}`)
        .then((response) => response.json().then((data) => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
          if (!ok || data.paymentStatus !== "paid") {
            copy.textContent = data.error || "We could not confirm this payment yet. Check the email Stripe sent if you completed checkout.";
            return;
          }
          const total = ((Number(data.amountTotal) || 0) / 100).toFixed(2);
          copy.textContent = "Your DA’POR order is confirmed. A receipt has been sent by Stripe.";
          meta.textContent = [data.email, total ? `Total $${total}` : ""].filter(Boolean).join(" · ");
        })
        .catch(() => {
          copy.textContent = "Payment was submitted. Refresh this page if the confirmation does not appear.";
        });
    })();
  </script>
</body>
</html>
